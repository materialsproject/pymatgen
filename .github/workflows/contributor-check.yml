name: PR Contributor Check

# pull_request_target (not pull_request) so the token can comment/label on PRs from forks.
# Safe because no PR code is checked out or run: only the pinned third-party action executes.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write # create the needs-review label on first use and apply it

jobs:
  check-contributor:
    # Bots (Dependabot, pre-commit.ci, ...) are trusted: skip them so their PRs get no comment or failing check.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch contributor-report action
        uses: actions/checkout@v5
        with:
          repository: jdiegosierra/contributor-report
          ref: e92e3ab844443019fbe7a2d51e07773ddacc6269 # v1.3.3
          path: .contributor-report
          persist-credentials: false

      # contributor-report v1.3.3 exits unless GITHUB_EVENT_NAME is exactly "pull_request". pull_request_target
      # carries the same pull_request payload, so run its bundled entry point with the event name overridden.
      # Inputs go in as INPUT_<NAME> env vars, which is how `uses:` would pass them.
      - name: Check Contributor Quality
        run: GITHUB_EVENT_NAME=pull_request node .contributor-report/dist/index.js
        env:
          INPUT_GITHUB-TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Individual thresholds
          INPUT_THRESHOLD-PR-MERGE-RATE: "0.3" # Require 30% merge rate
          INPUT_THRESHOLD-ACCOUNT-AGE: "30" # Require 30+ day old accounts
          INPUT_THRESHOLD-POSITIVE-REACTIONS: "1" # Require at least 1 positive reaction
          INPUT_THRESHOLD-NEGATIVE-REACTIONS: "5" # Allow max 5 negative reactions
          INPUT_THRESHOLD-MERGER-DIVERSITY: "2" # Require 2+ unique maintainers who merged PRs
          INPUT_THRESHOLD-REPO-HISTORY-MERGE-RATE: "0.3" # Require 30% merge rate in this repo
          INPUT_THRESHOLD-REPO-HISTORY-MIN-PRS: "1" # Require at least 1 previous PR in repo
          INPUT_THRESHOLD-PROFILE-COMPLETENESS: "20" # Require profile completeness score >= 20

          # Spam detection
          INPUT_ENABLE-SPAM-DETECTION: "true"

          # Metrics that must pass (comma-separated)
          INPUT_REQUIRED-METRICS: "prMergeRate,accountAge"

          # Minimum stars for "quality" repos
          INPUT_MINIMUM-STARS: "50"

          # Analysis window in months
          INPUT_ANALYSIS-WINDOW: "12"

          # Trusted users (always pass). Replaces the action's default list, so its bots are repeated here.
          INPUT_TRUSTED-USERS: "dependabot[bot],renovate[bot],github-actions[bot],codecov[bot],sonarcloud[bot],pre-commit-ci[bot]"

          # Trusted organizations (members skip the check)
          INPUT_TRUSTED-ORGS: "materialsproject,materialyzeai"

          # Action on fail: comment, label, fail, comment-and-label, none
          INPUT_ON-FAIL: "comment-and-label"
          INPUT_LABEL-NAME: "needs-review"

          # Test mode - log but don't act
          INPUT_DRY-RUN: "false"

          # Show detailed evidence: none, failed, all
          INPUT_VERBOSE-DETAILS: "failed"

          # New account handling: neutral, require-review, block
          INPUT_NEW-ACCOUNT-ACTION: "require-review"
          INPUT_NEW-ACCOUNT-THRESHOLD-DAYS: "14"
